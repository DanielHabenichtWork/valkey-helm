name: E2E (live cluster)

# Live-cluster e2e testing. Additive to the static workflows (test*.yml render,
# unittest*.yml lint+unittest) — those are unchanged.
#
# Each testing layer is an independent job that calls the SAME Just target a
# developer runs locally; the only difference is that helm/kind-action provides
# the cluster here instead of `just e2e-up`. This is what keeps CI and local from
# drifting.
#
# Jobs: helm-test (layer 2 smoke) + valkey-chart / valkey-operator (layer 3
# Chainsaw e2e + failure injection). Each calls the same Just target as local.

on:
  pull_request:
    paths:
      - "valkey/**"
      - "valkey-operator/**"
      - "test/e2e/**"
      - ".github/workflows/e2e.yml"
  push:
    branches:
      - main
    paths:
      - "valkey/**"
      - "valkey-operator/**"
      - "test/e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Layer 2: install Valkey with auth enabled and run the chart's `helm test` hooks.
  helm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.4

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: valkey-e2e
          config: test/e2e/kind-config.yaml
          node_image: kindest/node:v1.31.6

      - name: helm test smoke (just helm-test)
        run: just helm-test

  # Layer 3: full deploy -> readiness -> pod-kill -> recovery for the chart.
  valkey-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.4

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: valkey-e2e
          config: test/e2e/kind-config.yaml
          node_image: kindest/node:v1.31.6

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.2.12

      - name: Chainsaw valkey chart suite (just e2e-valkey)
        run: just e2e-valkey

  # Layer 3: operator install -> cluster Ready -> primary-failure -> promotion.
  valkey-operator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.4

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: valkey-e2e
          config: test/e2e/kind-config.yaml
          node_image: kindest/node:v1.31.6

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.2.12

      - name: Chainsaw valkey-operator suite (just e2e-operator)
        run: just e2e-operator
