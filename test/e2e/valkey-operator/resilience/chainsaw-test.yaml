# Layer 3 — valkey-operator: resilience / failure injection.
# Create cluster -> seed keys across slots -> kill a primary pod -> operator promotes
# its replica and reconciles back to Ready -> data survives.
#
# See ../deploy/chainsaw-test.yaml for the shared conventions (the operator is
# installed once per cluster by `just e2e-operator`, not per test). Cluster pods are
# reached by pod-exec (the operator-managed Service name lives in the operator
# source, not this repo). The minimal CR does not enable auth, so valkey-cli needs no
# credentials. The primary pod is deleted with `kubectl delete` inside a script (its
# name is discovered dynamically, and Chainsaw's `delete` would block on the
# same-name pod the operator recreates).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: valkey-operator-resilience
spec:
  catch:
    - describe:
        apiVersion: valkey.io/v1alpha1
        kind: ValkeyCluster
    - script:
        content: kubectl -n valkey-operator-system logs -l control-plane=controller-manager --tail=200 || true
  steps:
    - name: create-cluster
      description: Apply the ValkeyCluster CR and wait for status Ready / readyShards=3.
      try:
        - apply:
            file: ../valkeycluster.yaml
        - assert:
            file: ../assert-cluster-ready.yaml

    - name: seed-data
      description: Write keys across slots via cluster-mode SET on a cluster pod.
      try:
        - script:
            content: |
              set -eu
              POD=$(kubectl -n "$NAMESPACE" get pods -o name | grep my-cluster | head -1 | cut -d/ -f2)
              for k in alpha bravo charlie delta echo; do
                kubectl -n "$NAMESPACE" exec "$POD" -- valkey-cli -c SET "e2e:$k" "val-$k"
              done

    - name: primary-failure
      description: |
        Delete a primary pod; the operator promotes its replica and reconciles the
        cluster back to Ready. Data written before the kill is still readable
        (survives via replication / promotion — no disk persistence needed).
      try:
        - script:
            content: |
              set -eu
              # Find the pod currently reporting role "master" and delete it.
              for p in $(kubectl -n "$NAMESPACE" get pods -o name | grep my-cluster); do
                if [ "$(kubectl -n "$NAMESPACE" exec "${p#pod/}" -- valkey-cli ROLE 2>/dev/null | head -1)" = master ]; then
                  kubectl -n "$NAMESPACE" delete "$p"
                  exit 0
                fi
              done
              echo "could not find a primary pod"; exit 1
        - assert:
            file: ../assert-cluster-ready.yaml
        - script:
            content: |
              set -eu
              POD=$(kubectl -n "$NAMESPACE" get pods -o name | grep my-cluster | head -1 | cut -d/ -f2)
              for k in alpha bravo charlie delta echo; do
                [ "$(kubectl -n "$NAMESPACE" exec "$POD" -- valkey-cli -c GET "e2e:$k" 2>/dev/null)" = "val-$k" ] \
                  || { echo "key e2e:$k lost"; exit 1; }
              done
