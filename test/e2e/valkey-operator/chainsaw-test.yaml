# Layer 3 — valkey-operator (cluster mode): install operator -> create cluster ->
# readiness via .status -> primary pod-kill -> operator-driven recovery (replica
# promotion / reconciliation) -> data-survival.
#
# Notes:
# - Chainsaw auto-injects $NAMESPACE and runs scripts with cwd = this test dir, so
#   the chart is referenced as ../../../valkey-operator.
# - Cluster pods are reached by pod-exec: the operator-managed Service name lives in
#   the operator source (not this repo), so exec is the robust path. The minimal CR
#   does not enable auth, so valkey-cli needs no credentials here.
# - The primary pod is deleted with `kubectl delete` inside a script (its name is
#   discovered dynamically, and Chainsaw's `delete` would block on the same-name
#   pod the operator recreates).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: valkey-operator
spec:
  catch:
    - describe:
        apiVersion: valkey.io/v1alpha1
        kind: ValkeyCluster
    - describe:
        apiVersion: v1
        kind: Pod
    - podLogs:
        selector: control-plane=controller-manager
    - events: {}
  steps:
    - name: install-operator
      description: helm install the operator (public ghcr image) and wait for it to be Available.
      try:
        - script:
            content: helm upgrade --install valkey-operator ../../../valkey-operator -n "$NAMESPACE"
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: valkey-operator
              status:
                availableReplicas: 1

    - name: create-cluster
      description: Apply the ValkeyCluster CR and wait for status Ready / readyShards=3.
      try:
        - apply:
            file: valkeycluster.yaml
        - assert:
            file: assert-cluster-ready.yaml

    - name: seed-data
      description: Write keys across slots via cluster-mode SET on a cluster pod.
      try:
        - script:
            content: |
              set -eu
              POD=$(kubectl -n "$NAMESPACE" get pods -o name | grep my-cluster | head -1 | cut -d/ -f2)
              for k in alpha bravo charlie delta echo; do
                kubectl -n "$NAMESPACE" exec "$POD" -- valkey-cli -c SET "e2e:$k" "val-$k"
              done

    - name: primary-failure
      description: |
        Delete a primary pod; the operator promotes its replica and reconciles the
        cluster back to Ready. Data written before the kill is still readable
        (survives via replication / promotion — no disk persistence needed).
      try:
        - script:
            content: |
              set -eu
              # Find the pod currently reporting role "master" and delete it.
              for p in $(kubectl -n "$NAMESPACE" get pods -o name | grep my-cluster); do
                if [ "$(kubectl -n "$NAMESPACE" exec "${p#pod/}" -- valkey-cli ROLE 2>/dev/null | head -1)" = master ]; then
                  kubectl -n "$NAMESPACE" delete "$p"
                  exit 0
                fi
              done
              echo "could not find a primary pod"; exit 1
        - assert:
            file: assert-cluster-ready.yaml
        - script:
            content: |
              set -eu
              POD=$(kubectl -n "$NAMESPACE" get pods -o name | grep my-cluster | head -1 | cut -d/ -f2)
              for k in alpha bravo charlie delta echo; do
                [ "$(kubectl -n "$NAMESPACE" exec "$POD" -- valkey-cli -c GET "e2e:$k" 2>/dev/null)" = "val-$k" ] \
                  || { echo "key e2e:$k lost"; exit 1; }
              done
