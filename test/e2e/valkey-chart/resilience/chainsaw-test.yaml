# Layer 3 — valkey chart: resilience / failure injection.
# Deploy -> seed+replicate -> kill a replica (self-heal + PVC data survival) ->
# kill the primary (pod-restart recovery + AOF data survival). Chainsaw owns its own
# liveness assertions; it does NOT call `helm test` (that is the smoke layer's job).
#
# See ../deploy/chainsaw-test.yaml for the shared conventions (workDir, $NAMESPACE,
# shared support files, global catch). Pods are deleted with `kubectl delete` inside
# a script, NOT Chainsaw's `delete` (which blocks until the object is gone — the
# StatefulSet recreates the pod with the same name, so that wait never resolves).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: valkey-chart-resilience
spec:
  catch:
    - podLogs:
        selector: app.kubernetes.io/name=valkey
  steps:
    - name: install
      description: helm install the valkey chart in HA mode with auth.
      try:
        - script:
            workDir: ../../../..
            content: |
              set -eu
              helm dependency build ./valkey
              helm upgrade --install valkey ./valkey -n "$NAMESPACE" -f test/e2e/valkey-chart/values.yaml
        - assert:
            file: ../assert-ready.yaml

    - name: seed-data
      description: Write a sentinel key on the primary and confirm it replicates.
      try:
        - script:
            content: |
              set -eu
              PASS=$(kubectl -n "$NAMESPACE" get secret valkey-auth -o jsonpath='{.data.default-password}' | base64 -d)
              cli() { pod=$1; shift; kubectl -n "$NAMESPACE" exec "$pod" -c valkey -- valkey-cli --user default --pass "$PASS" --no-auth-warning "$@"; }
              cli valkey-0 SET e2e-sentinel hello-valkey
              for i in $(seq 30); do
                [ "$(cli valkey-1 GET e2e-sentinel 2>/dev/null)" = hello-valkey ] && exit 0
                sleep 2
              done
              echo "sentinel did not replicate to valkey-1"; exit 1

    - name: replica-failure
      description: Kill a replica; StatefulSet self-heals and data survives the new PVC mount.
      try:
        - script:
            content: kubectl -n "$NAMESPACE" delete pod valkey-1
        - assert:
            file: ../assert-ready.yaml
        - script:
            content: |
              set -eu
              PASS=$(kubectl -n "$NAMESPACE" get secret valkey-auth -o jsonpath='{.data.default-password}' | base64 -d)
              cli() { kubectl -n "$NAMESPACE" exec valkey-1 -c valkey -- valkey-cli --user default --pass "$PASS" --no-auth-warning "$@"; }
              for i in $(seq 30); do
                [ "$(cli GET e2e-sentinel 2>/dev/null)" = hello-valkey ] && exit 0
                sleep 2
              done
              echo "sentinel not readable on valkey-1 after restart"; exit 1

    - name: primary-recovery
      description: |
        Kill the primary; the plain chart has NO auto-failover, so this verifies
        pod-restart recovery + AOF data survival (pod-0 reloads from its PVC).
        Replica promotion on primary loss is covered by the operator suite.
      try:
        - script:
            content: kubectl -n "$NAMESPACE" delete pod valkey-0
        - assert:
            file: ../assert-ready.yaml
        - script:
            content: |
              set -eu
              PASS=$(kubectl -n "$NAMESPACE" get secret valkey-auth -o jsonpath='{.data.default-password}' | base64 -d)
              cli() { kubectl -n "$NAMESPACE" exec valkey-0 -c valkey -- valkey-cli --user default --pass "$PASS" --no-auth-warning "$@"; }
              for i in $(seq 30); do
                [ "$(cli ROLE 2>/dev/null | head -1)" = master ] && [ "$(cli GET e2e-sentinel 2>/dev/null)" = hello-valkey ] && exit 0
                sleep 2
              done
              echo "primary did not recover as master with data"; exit 1
