# Chainsaw configuration for the layer-3 e2e + failure-injection suites.
#
# Valkey rollout and operator reconciliation are slow (image pulls, StatefulSet
# ordered startup, replica sync, operator promotion), so assert/exec timeouts are
# deliberately generous. Each Test runs in its own ephemeral namespace, which
# Chainsaw creates and tears down automatically.
#
# `chainsaw test <chart-dir>` recurses into subdirectories, so each chart dir holds
# multiple tests — one per subfolder (e.g. valkey-chart/deploy, valkey-chart/
# resilience). Add a new scenario by adding a new subfolder with a chainsaw-test.yaml.
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: valkey-e2e
spec:
  timeouts:
    apply: 2m
    assert: 8m
    cleanup: 3m
    delete: 2m
    error: 2m
    exec: 6m
  # Universal diagnostics dumped on any test failure (merged with each test's own
  # chart-specific `catch`, e.g. podLogs selectors).
  error:
    catch:
      - events: {}
      - describe:
          apiVersion: v1
          kind: Pod
